name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify tag and package version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
          TAG_OBJECT_SHA=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
            --jq 'select(.object.type == "tag") | .object.sha')
          test -n "$TAG_OBJECT_SHA"
          TAG_TARGET=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT_SHA}" \
            --jq 'select(.object.type == "commit") | .object.sha')
          test "$TAG_TARGET" = "$GITHUB_SHA"
          test "$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT_SHA}" \
            --jq '.verification.verified')" = true
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build staged multi-platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/openstreamalert-release,tar=false
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.release.outputs.created }}
          provenance: false
          sbom: false
      - name: Scan both staged platforms
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          for platform in linux/amd64 linux/arm64; do
            docker run --rm \
              --volume "$RUNNER_TEMP:/work:ro" \
              --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              aquasec/trivy:0.68.1@sha256:a93fd67162843c0f749002af9245fe9a2e5edc41445bd71d3949c803e95ef05b \
              image --scanners vuln --skip-version-check --ignore-unfixed \
              --severity HIGH,CRITICAL --exit-code 1 --platform "$platform" \
              --input /work/openstreamalert-release
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable images
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.release.outputs.created }}
          provenance: mode=max
          sbom: true
      - name: Verify published platforms
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect --raw \
            "ghcr.io/${{ github.repository }}@$IMAGE_DIGEST" > manifest.json
          jq -e '
            [.manifests[].platform | "\(.os)/\(.architecture)"] as $platforms
            | ($platforms | index("linux/amd64")) != null
              and ($platforms | index("linux/arm64")) != null
          ' manifest.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --notes "Container: ghcr.io/${{ github.repository }}:$RELEASE_TAG

          Multi-platform digest: $IMAGE_DIGEST"
