name: Public demo

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the credential-free studio
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build:demo
      # actions/upload-pages-artifact currently invokes an unpinned nested
      # action. Archive explicitly so repository-wide SHA pinning can stay on.
      - name: Archive the Pages site
        run: |
          tar --dereference --hard-dereference \
            --directory dist/client \
            --create --verbose --file "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git --exclude=.github .
      - name: Upload the Pages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.event.repository.visibility == 'public'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy public demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
