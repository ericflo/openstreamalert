name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Version the namespace so a GitHub runner stuck while cancelling can be
  # bypassed without weakening normal cancel-on-new-commit behavior.
  group: ci-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:demo
      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  twitch-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install checksum-verified Twitch CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/twitch-cli.tar.gz"
          install_dir="${RUNNER_TEMP}/twitch-cli"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/twitchdev/twitch-cli/releases/download/v1.1.24/twitch-cli_1.1.24_Linux_x86_64.tar.gz
          echo "9cae4e9cd52e66fb4dda6b633b3276a4450a28a83dea7a4651a42a67372eed8f  $archive" \
            | sha256sum --check --strict
          mkdir --parents "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" \
            --strip-components=1
          echo "TWITCH_CLI_BIN=${install_dir}/twitch" >> "$GITHUB_ENV"
      - run: npm run test:twitch-cli

  windows-desktop:
    runs-on: windows-latest
    env:
      TWITCH_DESKTOP_CLIENT_ID: ${{ vars.TWITCH_DESKTOP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Use the repository package manager
        run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:demo
      - name: Build the Windows installer and portable archive
        run: npm run make:win
      - name: Smoke-test the packaged desktop runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $executable = Get-ChildItem out -Recurse -Filter OpenStreamAlert.exe |
            Where-Object { $_.FullName -notmatch "[\\/]make[\\/]" } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $executable) { throw "Packaged executable not found" }
          $desktop = Start-Process $executable -PassThru
          try {
            $ready = $null
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $ready = Invoke-RestMethod "http://127.0.0.1:17071/readyz"
                break
              } catch {
                if ($desktop.HasExited) {
                  throw "Desktop process exited before readiness"
                }
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready.ok -or -not $ready.database) {
              throw "Packaged desktop never became ready"
            }
            $listeners = Get-NetTCPConnection -State Listen -LocalPort 17071
            if ($listeners.LocalAddress -contains "0.0.0.0" -or
                $listeners.LocalAddress -contains "::") {
              throw "Desktop listener escaped loopback"
            }
            $second = Start-Process $executable -PassThru
            if (-not $second.WaitForExit(15000) -or $second.ExitCode -ne 0) {
              throw "Second launch did not hand off cleanly"
            }
            $securityConfig = Join-Path $env:APPDATA "OpenStreamAlert/desktop.json"
            $database = Join-Path $env:APPDATA "OpenStreamAlert/data/openstreamalert.sqlite"
            if (-not (Test-Path $securityConfig) -or -not (Test-Path $database)) {
              throw "Desktop data was not created in the per-user directory"
            }
            $securityHash = (Get-FileHash $securityConfig -Algorithm SHA256).Hash

            $quit = Start-Process $executable -ArgumentList "--quit" -PassThru
            if (-not $quit.WaitForExit(15000) -or -not $desktop.WaitForExit(15000)) {
              throw "Tray Quit did not stop the desktop process"
            }
            if (Get-NetTCPConnection -State Listen -LocalPort 17071 -ErrorAction SilentlyContinue) {
              throw "Tray Quit did not release the loopback listener"
            }

            $desktop = Start-Process $executable -PassThru
            $restarted = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $ready = Invoke-RestMethod "http://127.0.0.1:17071/readyz"
                $restarted = $ready.ok -and $ready.database
                if ($restarted) { break }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $restarted) { throw "Desktop did not restart cleanly" }
            if ((Get-FileHash $securityConfig -Algorithm SHA256).Hash -ne $securityHash) {
              throw "The DPAPI-protected key changed across restart"
            }
            $finalQuit = Start-Process $executable -ArgumentList "--quit" -PassThru
            if (-not $finalQuit.WaitForExit(15000) -or
                -not $desktop.WaitForExit(15000)) {
              throw "Final desktop Quit did not complete"
            }
          } finally {
            Get-Process OpenStreamAlert -ErrorAction SilentlyContinue |
              Stop-Process -Force
          }
      - name: Upload Windows package evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-desktop-${{ github.sha }}
          path: |
            out/make/squirrel.windows/x64/*
            out/make/zip/win32/x64/*
          if-no-files-found: error
          retention-days: 14

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Compose deployment
        run: |
          cp .env.example .env
          docker compose config --quiet
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          tags: openstreamalert:test
          build-args: |
            VERSION=ci-${{ github.sha }}
            REVISION=${{ github.sha }}
            CREATED=${{ github.event.repository.updated_at }}
      - name: Boot and verify the production image
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name openstreamalert-ci \
            --init \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --publish 127.0.0.1:5173:5173 \
            openstreamalert:test
          trap 'docker logs openstreamalert-ci; docker rm --force openstreamalert-ci' EXIT

          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:5173/readyz > ready.json; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' openstreamalert-ci | grep -qx true; then
              echo "Container exited before becoming ready"
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:5173/livez
          curl --fail --silent --show-error http://127.0.0.1:5173/api/status > status.json
          node -e "const fs=require('node:fs'); const ready=JSON.parse(fs.readFileSync('ready.json')); const status=JSON.parse(fs.readFileSync('status.json')); if (!ready.ok || ready.database !== true || ready.version !== 'ci-${{ github.sha }}' || status.configured !== false) process.exit(1)"
      - name: Scan the final image
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.68.1@sha256:a93fd67162843c0f749002af9245fe9a2e5edc41445bd71d3949c803e95ef05b \
            image --scanners vuln --skip-version-check --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 openstreamalert:test
