name: Bug report
description: Report a reproducible problem in the studio, server, or OBS overlay.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove private overlay URLs, OAuth values, and personal data from screenshots and logs.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Tell us what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest reliable sequence of steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenStreamAlert version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, browser, and OBS version
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Safe logs or context
